<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice del Proyecto Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #f8cdda 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #5c3a44;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(216, 112, 147, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #ffe4ec;
            color: #d6336c;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        h1 {
            color: #9e2a4b;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .integrantes {
            background: #fff5f7;
            padding: 12px 18px;
            border-radius: 14px;
            color: #7a4956;
            font-size: 14px;
            margin-bottom: 30px;
            border: 1px dashed #f3b5c6;
        }
        .link-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-box a {
            display: block;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            padding: 16px 20px;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 6px 15px rgba(255, 117, 140, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .link-box a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(255, 117, 140, 0.5);
        }
        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #a37482;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge"> PORTAL DEL PROYECTO </span>
        <h1>Índice de Actividades y Repositorios</h1>
        
        <div class="integrantes">
            <strong>Integrantes del equipo:</strong><br>
            Mercedes Rodríguez • Ameyali Enríquez • Maite
        </div>
        
        <div class="link-box">
            <a href="https://github.com/mer-rodriguez10/proyecto-web" target="_blank"> Repositorio en GitHub (Proyecto Web)</a>
            <a href=https://trello.com/invite/b/6af4f364a3a0ecef003c7b51/ATTIb36f8ac8e38e852bcda2e0faf81defc60C2774B8/proyecto-web target="_blank"> Tablero Ágil en Trello</a>
        </div>

        <p class="footer-note">Desarrollo Web & Metodologías Ágiles • 2026</p>
    </div>
</body>
</html>
